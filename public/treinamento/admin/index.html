<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin - Área de Treinamento</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gray-50">

  <header class="bg-white border-b border-gray-200">
    <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">

      <div>
        <p class="text-sm text-gray-500">Área administrativa</p>
        <h1 class="text-xl font-bold text-gray-900">
          AO Scan Brasil
        </h1>
      </div>

      <div class="flex items-center gap-4">
        <span id="admin-name" class="text-sm text-gray-600"></span>

        <a
          href="/treinamento/"
          class="text-sm font-medium text-blue-600 hover:underline"
        >
          Voltar ao treinamento
        </a>
      </div>

    </div>
  </header>

  <main class="max-w-5xl mx-auto px-6 py-10">

    <div class="mb-8">
      <h2 class="text-3xl font-bold text-gray-900">
        Gerenciar alunos
      </h2>

      <p class="mt-2 text-gray-600">
        Cadastre novos acessos à área de treinamento.
      </p>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6">

      <h3 class="text-xl font-semibold text-gray-900 mb-6">
        Cadastrar novo aluno
      </h3>

      <form id="create-user-form" class="space-y-5">

        <div>
          <label
            for="name"
            class="block text-sm font-medium text-gray-700 mb-1"
          >
            Nome
          </label>

          <input
            id="name"
            type="text"
            required
            autocomplete="name"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
          >
        </div>

        <div>
          <label
            for="email"
            class="block text-sm font-medium text-gray-700 mb-1"
          >
            E-mail
          </label>

          <input
            id="email"
            type="email"
            required
            autocomplete="email"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
          >
        </div>

        <div>
          <label
            for="password"
            class="block text-sm font-medium text-gray-700 mb-1"
          >
            Senha inicial
          </label>

          <input
            id="password"
            type="password"
            required
            minlength="8"
            autocomplete="new-password"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
          >

          <p class="mt-1 text-xs text-gray-500">
            Mínimo de 8 caracteres.
          </p>
        </div>

        <div id="message" class="hidden text-sm rounded-lg px-4 py-3"></div>

        <button
          id="submit-button"
          type="submit"
          class="w-full sm:w-auto px-6 py-3 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 disabled:opacity-60"
        >
          Cadastrar aluno
        </button>

      </form>
    </div>

  </main>

  <script src="./admin.js"></script>

</body>

</html>
