<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Minha conta - Área de Treinamento</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gray-50">

  <header class="bg-white border-b border-gray-200">
    <div class="max-w-3xl mx-auto px-6 py-4 flex items-center justify-between">

      <div>
        <p class="text-sm text-gray-500">Área de treinamento</p>
        <h1 class="text-xl font-bold text-gray-900">
          Minha conta
        </h1>
      </div>

      <a
        href="/treinamento/"
        class="text-sm font-medium text-blue-600 hover:underline"
      >
        Voltar
      </a>

    </div>
  </header>

  <main class="max-w-3xl mx-auto px-6 py-10">

    <div class="mb-8">
      <h2 class="text-3xl font-bold text-gray-900">
        Alterar senha
      </h2>

      <p class="mt-2 text-gray-600">
        Atualize sua senha de acesso à área de treinamento.
      </p>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6">

      <div class="mb-6 p-4 bg-gray-50 rounded-xl">
        <p class="text-sm text-gray-500">
          Usuário
        </p>

        <p
          id="user-name"
          class="mt-1 font-semibold text-gray-900"
        ></p>

        <p
          id="user-email"
          class="text-sm text-gray-600"
        ></p>
      </div>

      <form id="change-password-form" class="space-y-5">

        <div>
          <label
            for="current-password"
            class="block text-sm font-medium text-gray-700 mb-1"
          >
            Senha atual
          </label>

          <input
            id="current-password"
            type="password"
            required
            autocomplete="current-password"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
          >
        </div>

        <div>
          <label
            for="new-password"
            class="block text-sm font-medium text-gray-700 mb-1"
          >
            Nova senha
          </label>

          <input
            id="new-password"
            type="password"
            required
            minlength="8"
            autocomplete="new-password"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
          >

          <p class="mt-1 text-xs text-gray-500">
            Mínimo de 8 caracteres.
          </p>
        </div>

        <div>
          <label
            for="confirm-password"
            class="block text-sm font-medium text-gray-700 mb-1"
          >
            Confirmar nova senha
          </label>

          <input
            id="confirm-password"
            type="password"
            required
            minlength="8"
            autocomplete="new-password"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
          >
        </div>

        <div
          id="message"
          class="hidden text-sm rounded-lg px-4 py-3"
        ></div>

        <button
          id="submit-button"
          type="submit"
          class="px-6 py-3 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 disabled:opacity-60"
        >
          Alterar senha
        </button>

      </form>
    </div>

  </main>

  <script src="./conta.js"></script>

</body>

</html>
