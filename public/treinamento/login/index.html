<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Área de Treinamento</title>
    <!-- SCRIPT DO TAILWIND CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="flex items-center justify-center min-h-screen bg-gradient-to-br from-blue-50 via-white to-green-50">

    <div class="w-full max-w-md p-8 m-4 space-y-8 bg-white rounded-2xl shadow-2xl">
        <div class="text-center">
            <h1 class="text-3xl font-bold text-gray-900">Acesso à Área de Treinamento</h1>
            <p class="mt-2 text-gray-600">Faça login para assistir aos vídeos.</p>
        </div>

        <form id="login-form" class="space-y-6">
            <div class="space-y-2">
                <label for="email" class="text-sm font-medium text-gray-700">E-mail</label>
                <input id="email" type="email" required placeholder="seu@email.com"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div class="space-y-2">
                <label for="password" class="text-sm font-medium text-gray-700">Senha</label>

                <div class="relative">
                    <input id="password" type="password" required placeholder="********"
                        class="w-full px-3 py-2 pr-12 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">

                    <button type="button" id="toggle-password"
                        class="absolute inset-y-0 right-0 flex items-center px-3 text-gray-500 hover:text-gray-700"
                        aria-label="Mostrar senha">
                        <!-- ÍCONE OLHO (mostrar) -->
                        <svg id="icon-eye" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none"
                            viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5
                                     c4.478 0 8.268 2.943 9.542 7
                                     -1.274 4.057-5.064 7-9.542 7
                                     -4.477 0-8.268-2.943-9.542-7z" />
                        </svg>

                        <!-- ÍCONE OLHO CORTADO (ocultar) -->
                        <svg id="icon-eye-off" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 hidden" fill="none"
                            viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19
                                     c-4.478 0-8.268-2.943-9.542-7
                                     a9.956 9.956 0 012.042-3.368" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6.223 6.223A9.956 9.956 0 0112 5
                                     c4.478 0 8.268 2.943 9.542 7
                                     a9.964 9.964 0 01-4.043 5.568" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3l18 18" />
                        </svg>
                    </button>
                </div>
            </div>

            <p id="error-message" class="text-sm text-red-600 text-center hidden"></p>
            <div>
                <button type="submit"
                    class="w-full py-3 font-bold text-white bg-gradient-to-r from-green-500 to-blue-600 rounded-lg hover:from-green-600 hover:to-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500">
                    Entrar
                </button>
            </div>
        </form>
    </div>

    <script>
        (() => {
            const passwordInput = document.getElementById('password');
            const toggleButton = document.getElementById('toggle-password');
            const iconEye = document.getElementById('icon-eye');
            const iconEyeOff = document.getElementById('icon-eye-off');

            toggleButton.addEventListener('click', () => {
                const isPassword = passwordInput.type === 'password';

                passwordInput.type = isPassword ? 'text' : 'password';
                iconEye.classList.toggle('hidden', isPassword);
                iconEyeOff.classList.toggle('hidden', !isPassword);
            });
        })();
    </script>

    <script src="./auth.js"></script>

</body>

</html>
